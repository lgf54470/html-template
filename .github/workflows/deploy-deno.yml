# Deno Deploy 自动部署 — 触发:push 到 main 或手动触发
# 前置:GitHub 仓库 Settings → Secrets and variables → Actions 添加:
#   DENO_DEPLOY_TOKEN  (Secret)Deno Deploy 访问令牌(console.deno.com → 账号 → Access Tokens 创建;
#                      组织令牌亦可,见 DEPLOY-DENO.md)
#   DENO_DEPLOY_ORG    (Variable)组织名(console.deno.com 网址路径中的名称)
#   DENO_DEPLOY_APP    (Variable)应用名(需已存在:首次用控制台 Git 导入或 `deno deploy create` 创建)
# 运行期环境变量(DATABASE_URL / DATABASE_AUTH_TOKEN / AUTH_PASSWORD / ENCRYPTION_KEY)
# 在 Deno Deploy 应用 Settings → Environment variables 中配置,不在本工作流管理。
# 详见 DEPLOY-DENO.md
name: Deploy to Deno Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # CLI 发布前会解析 deno.json 的 deploy 段,要求其中已含 org / app
      # (否则报 "Failed to parse deploy configuration: missing field org"),
      # 这里用官方 switch 子命令把组织 / 应用写入 deno.json(已在文件里则为幂等)。
      - name: Set Deno Deploy org/app context
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno deploy switch \
            --org "${{ vars.DENO_DEPLOY_ORG }}" \
            --app "${{ vars.DENO_DEPLOY_APP }}"

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno deploy \
            --org "${{ vars.DENO_DEPLOY_ORG }}" \
            --app "${{ vars.DENO_DEPLOY_APP }}" \
            --ignore sqlite.db \
            --ignore sqlite.db-wal \
            --ignore sqlite.db-shm \
            --ignore .env \
            --ignore .env.local \
            --ignore .dev.vars \
            --ignore server/.secret-key \
            --prod
