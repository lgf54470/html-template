# ============================================================
# docker-compose.yml — 一键启动自托管服务
# ------------------------------------------------------------
# 用法:
#   AUTH_PASSWORD=xxx docker compose up -d --build   # 首次构建并启动
#   docker compose logs -f                           # 查看日志
#   docker compose down                              # 停止(数据卷保留)
#   docker compose down -v                           # 停止并删除数据卷(慎用)
# 完整说明见 docs/deploy/docker.md。
# ============================================================
services:
  html-template:
    build: .
    image: html-template:latest
    container_name: html-template
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # 登录密码(必设:compose 会读取宿主机同名环境变量或 .env 文件,
      # 未设置时启动直接报错,不会生成随机密码)
      AUTH_PASSWORD: ${AUTH_PASSWORD:?请设置 AUTH_PASSWORD(如 AUTH_PASSWORD=xxx docker compose up -d)}
      # 敏感数据加密密钥(生产必设:openssl rand -hex 32 生成;
      # 不设置则自动生成到镜像内 server/.secret-key,容器重建后会丢失,已加密数据将无法解密)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # 数据库驱动:默认本地 sqlite;也可 DB_DRIVER=turso 连远程 Turso
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      # 本地 sqlite 存到数据卷 /app/data,容器重建 / 升级不丢数据
      SQLITE_PATH: /app/data/sqlite.db
    volumes:
      - html-data:/app/data
    # 可选:复用项目根目录 .env(仅补充缺失项,进程环境变量优先)
    env_file:
      - path: .env
        required: false

volumes:
  html-data:
