# ============================================================
# Cloudflare Workers 配置 — 完整部署说明见 docs/deploy/cloudflare.md
# 使用前必做:
#   1. npx wrangler d1 create html-template-db
#      把返回的 database_id 填入下方 [[d1_databases]]
#   2. npx wrangler secret put AUTH_PASSWORD   (首次登录密码,生产必设)
#   3. npx wrangler secret put ENCRYPTION_KEY  (敏感数据密钥,openssl rand -hex 32 生成)
#   4. npx wrangler deploy
# ============================================================
name = "html-template"
main = "worker.js"
compatibility_date = "2025-01-01"
# node:crypto(密码哈希 / AES-GCM)依赖 Node.js 兼容层
compatibility_flags = ["nodejs_compat"]

# 静态资源:仓库根目录即站点目录(index.html / js / assets)
# 排除项见根目录 .assetsignore(gitignore 格式)
[assets]
directory = "./"
binding = "ASSETS"
# run_worker_first 默认 false:静态资源优先,未命中资源的请求(如 /api/*)才进入 worker.js
# not_found_handling 默认 none:不存在的路径返回 404(本应用为 Hash 路由,无需 SPA 兜底)

# D1 数据库(完整模式必需;首次用 wrangler d1 create 创建后回填 ID)
# 注意:新版本 wrangler 要求数组形式 [[d1_databases]](旧版 [d1_databases] 对象形式会报错)
[[d1_databases]]
binding = "DB"
database_name = "html-template-db"
database_id = "1e399955-c38d-4155-8555-c7bc35a489b0"

# 注意:敏感配置(AUTH_PASSWORD / ENCRYPTION_KEY)不要写在这里!
# 生产用 `wrangler secret put <名称>` 设置;本地调试写在 .dev.vars(见 .dev.vars.example)
